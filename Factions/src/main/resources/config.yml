# =============================================================================
# Factions Plugin Configuration
# =============================================================================

# General Settings
general:
  # Maximum faction name length (1-16 characters)
  max-faction-name-length: 16

  # Maximum factions that can be created on the server (-1 for unlimited)
  max-factions: -1

  # Default faction description when created
  default-faction-description: ""

  # Whether factions are public by default when created
  default-public-faction: false

  # Message cooldown to prevent spam (in milliseconds)
  message-cooldown: 5000

# Power System Configuration
power:
  # Starting power for new players
  starting-power: 10

  # Maximum power per player
  max-power-per-player: 20

  # Power cost to claim a chunk (one-time cost)
  power-per-chunk: 2

  # Power restored when unclaiming a chunk
  power-restore-per-chunk: 1

  # Power regeneration settings
  regeneration:
    # How much power regenerates per interval
    amount: 2

    # How often power regenerates (in minutes)
    interval-minutes: 60

    # Whether power regenerates while offline
    offline-regeneration: true

    # Whether power regenerates while online (based on playtime)
    online-regeneration: true

# Territory Settings
territory:
  # World size for wilderness initialization (in chunks)
  # 1562 chunks = ~25k blocks from center
  world-size-chunks: 1562

  # Special territory names (don't change unless you know what you're doing)
  special-territories:
    spawn: "Spawn"
    warzone: "Warzone"
    wilderness: "Wilderness"

  # Map display settings
  map:
    # Radius for faction map display
    radius-x: 10
    radius-z: 7

# MultiWorlds GUI Configuration
multiworlds-gui:
  # GUI size (must be multiple of 9: 9, 18, 27, 36, 45, 54)
  size: 9
  # GUI title
  title: "Choose a world"
  # World slot assignments (0-based indexing)
  world-slots:
    world: 1
    world2: 3
    world_nether: 5
    world_the_end: 7

